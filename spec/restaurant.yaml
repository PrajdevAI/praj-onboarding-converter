modifier_groups:
  temperature:
    name: Temperature
    required: true
    options:
      - {name: Medium Rare, price: 0, cost: 0, w: 3}
      - {name: Medium,      price: 0, cost: 0, w: 5}
      - {name: Medium Well, price: 0, cost: 0, w: 3}
      - {name: Well Done,   price: 0, cost: 0, w: 2}
  side_choice:
    name: Side Choice
    required: true
    options:
      - {name: French Fries,     price: 0, cost: 0.85, w: 6}
      - {name: Side Salad,       price: 0, cost: 0.90, w: 3}
      - {name: Garlic Mashed,    price: 0, cost: 0.80, w: 2}
      - {name: Seasonal Veg,     price: 0, cost: 0.90, w: 2}
      - {name: Sub Sweet Potato Fries, price: 1.50, cost: 1.20, w: 2}
  burger_addon:
    name: Add-Ons
    required: false
    max: 2
    attach_prob: 0.35
    options:
      - {name: Add Avocado,         price: 1.75, cost: 0.65, w: 5}
      - {name: Extra Cheese,        price: 1.50, cost: 0.40, w: 4}
      - {name: Sauteed Mushrooms,   price: 1.50, cost: 0.45, w: 3}
      - {name: Fried Egg,           price: 1.50, cost: 0.30, w: 2}
  protein_addon:
    name: Add Protein
    required: false
    max: 1
    attach_prob: 0.40
    options:
      - {name: Add Tofu,     price: 4.00, cost: 1.20, w: 5}
      - {name: Add Paneer,   price: 4.50, cost: 1.60, w: 4}
      - {name: Add Falafel,  price: 3.50, cost: 1.00, w: 3}
  dressing:
    name: Dressing
    required: true
    options:
      - {name: Ranch,          price: 0, cost: 0, w: 5}
      - {name: Balsamic,       price: 0, cost: 0, w: 3}
      - {name: Caesar,         price: 0, cost: 0, w: 4}
      - {name: Lemon Tahini,   price: 0, cost: 0, w: 2}

