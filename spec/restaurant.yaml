# Harbor Grill - a single-location independent full-service restaurant.
# This spec is the single source of truth for the dummy data generators.
# Everything in raw_uploads/ is rendered from it, so sales, purchases,
# payroll and settlements agree with each other.

business:
  name: Harbor Grill
  legal_name: Harbor Grill LLC
  location_name: Harbor Grill - Westport
  toast_location_code: "1"
  city: Kansas City
  state: MO
  timezone: America/Chicago
  business_day_closeout: "04:00"     # Toast default closeout hour
  sales_tax_rate: 0.0825
  period_start: 2025-10-01
  period_end: 2026-09-30
  seed: 20251001
  pos: Toast
  accounting: QuickBooks Online
  payroll: Gusto

hours:                                 # open hours by weekday (0=Mon)
  0: ["11:00", "22:00"]
  1: ["11:00", "22:00"]
  2: ["11:00", "22:00"]
  3: ["11:00", "23:00"]
  4: ["11:00", "00:30"]
  5: ["10:00", "00:30"]
  6: ["10:00", "21:00"]

volume:
  base_orders_per_day: 78
  weekday_multiplier: {0: 0.80, 1: 0.78, 2: 0.88, 3: 1.00, 4: 1.30, 5: 1.38, 6: 1.05}
  month_multiplier: {10: 1.00, 11: 1.02, 12: 1.12, 1: 0.86, 2: 0.88, 3: 0.98, 4: 1.00, 5: 1.06, 6: 1.04, 7: 1.08, 8: 1.07, 9: 0.99}
  channel_mix:                         # Toast dining option -> share of orders
    "Dine In": 0.52
    "Take Out": 0.22
    "Delivery": 0.21                   # third-party (DoorDash) orders arriving through Toast
    "Catering": 0.01
  online_share_of_takeout: 0.45        # Take Out orders placed via Toast Online Ordering
  lines_per_order: {"Dine In": 3.4, "Take Out": 2.3, "Delivery": 2.4, "Catering": 9.0}
  guests_per_dinein_order: 2.3
  void_rate: 0.008                     # share of item lines voided
  refund_rate: 0.004                   # share of payments partially refunded
  card_share: 0.82                     # of in-store/online payments; rest cash (gift card small)
  gift_card_share: 0.03
  tip_rate_card: 0.185
  auto_gratuity_party_size: 6
  auto_gratuity_rate: 0.18
  feedback_rate: 1.0                   # dummy data: feedback captured for every order
  loyalty_rate: 1.0                    # dummy data: loyalty id on every check

